stages:
  - quality
  - test
  - integration
  - mutation

# CI checks out a shallow, detached HEAD with no tags, so Composer cannot infer
# the package version and defaults swiftmailer/swiftmailer to 1.0.0. That trips
# roave/security-advisories' "conflicts with swiftmailer/swiftmailer <6.2.5"
# rule and breaks dependency resolution. Pin the root version explicitly so
# resolution sees a >= 6.2.5 root. Bump the minor line when it changes.
variables:
  COMPOSER_ROOT_VERSION: "6.5.x-dev"

# ---------------------------------------------------------------------------
# Shared configuration for test-stage jobs
# ---------------------------------------------------------------------------
.test-job:
  stage: test
  image: php:8.5-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip libicu-dev libzip-dev libxml2-dev libcurl4-openssl-dev > /dev/null
    - docker-php-ext-install intl iconv mbstring zip dom curl > /dev/null 2>&1 || true
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer update --no-interaction --no-progress --classmap-authoritative
  cache:
    key: "${CI_COMMIT_REF_SLUG}-composer"
    paths:
      - vendor/
    policy: pull-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  tags:
    - t5-aws-docker
# ---------------------------------------------------------------------------
# Quality stage — existing Qodana job (develop only)
# ---------------------------------------------------------------------------
qodana:
  stage: quality
  only:
    - develop
  variables:
    QODANA_TOKEN: $QODANA_TOKEN
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_STRATEGY: clone
    DISABLE_AUTO_INSTALL: "true"
  script:
    - qodana scan --clear-cache
  tags:
    - t5-fast-shell

# ---------------------------------------------------------------------------
# Test stage — 4 parallel jobs
# ---------------------------------------------------------------------------
validate:
  stage: test
  image: php:8.5-cli
  before_script:
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - composer validate --strict --no-check-publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  tags:
    - t5-aws-docker

security-audit:
  stage: test
  image: php:8.5-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress --ignore-platform-reqs
  script:
    - composer audit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  tags:
    - t5-aws-docker

code-style:
  extends: .test-job
  script:
    - vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff --verbose

phpstan:
  extends: .test-job
  script:
    - vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress --memory-limit=1G

tests:
  extends: .test-job
  parallel:
    matrix:
      - PHP_VERSION: ["8.3", "8.5"]
  image: "php:${PHP_VERSION}-cli"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-composer-php${PHP_VERSION}"
    paths:
      - vendor/
    policy: pull-push
  variables:
    SYMFONY_DEPRECATIONS_HELPER: "max[direct]=0&max[self]=0"
  script:
    - vendor/bin/simple-phpunit --testsuite="SwiftMailer unit tests" --verbose --log-junit phpunit-report.xml
  artifacts:
    when: always
    paths:
      - phpunit-report.xml
    reports:
      junit: phpunit-report.xml
    expire_in: 30 days

# ---------------------------------------------------------------------------
# Integration stage — smoke tests against Mailpit
# ---------------------------------------------------------------------------
smoke-tests:
  stage: integration
  image: php:8.5-cli
  services:
    - name: axllent/mailpit:latest
      alias: mailpit
  variables:
    MAILPIT_SMTP_HOST: mailpit
    MAILPIT_SMTP_PORT: "1025"
    MAILPIT_API_URL: "http://mailpit:8025"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip libicu-dev libzip-dev libxml2-dev libcurl4-openssl-dev > /dev/null
    - docker-php-ext-install intl iconv mbstring zip dom curl > /dev/null 2>&1 || true
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer update --no-interaction --no-progress --classmap-authoritative
  script:
    - vendor/bin/simple-phpunit tests/smoke/Swift/Smoke/MailpitSmokeTest.php --verbose
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  tags:
    - t5-aws-docker

# ---------------------------------------------------------------------------
# Mutation stage — Infection mutation testing
# ---------------------------------------------------------------------------
mutation-testing:
  extends: .test-job
  stage: mutation
  script:
    - pecl install xdebug > /dev/null 2>&1 && docker-php-ext-enable xdebug
    - mkdir -p .infection/infection
    - SYMFONY_DEPRECATIONS_HELPER=disabled XDEBUG_MODE=coverage vendor/bin/phpunit
        --testsuite='SwiftMailer unit tests'
        --coverage-xml=.infection/infection/coverage-xml
        --log-junit=.infection/infection/junit.xml
    - php -d memory_limit=1G vendor/bin/infection
        --threads=$(nproc)
        --skip-initial-tests
        --coverage=.infection/infection
        --min-msi=${INFECTION_MIN_MSI:-0}
        --min-covered-msi=${INFECTION_MIN_COVERED_MSI:-0}
        --logger-html=infection.html
        --no-progress
        --show-mutations
  timeout: 45 minutes
  allow_failure: true
  artifacts:
    when: always
    paths:
      - infection.html
      - infection.log
      - infection-summary.log
      - infection-per-mutator.md
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main")'

mutation-testing-mr:
  extends: .test-job
  stage: mutation
  script:
    - pecl install xdebug > /dev/null 2>&1 && docker-php-ext-enable xdebug
    - CHANGED=$(git diff --name-only origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}...HEAD
        -- 'lib/classes/**.php' | paste -sd, -)
    - |
      if [ -z "$CHANGED" ]; then
        echo "No source files changed, skipping mutation testing."
        exit 0
      fi
    - mkdir -p .infection/infection
    - SYMFONY_DEPRECATIONS_HELPER=disabled XDEBUG_MODE=coverage vendor/bin/phpunit
        --testsuite='SwiftMailer unit tests'
        --coverage-xml=.infection/infection/coverage-xml
        --log-junit=.infection/infection/junit.xml
    - php -d memory_limit=1G vendor/bin/infection
        --threads=$(nproc)
        --skip-initial-tests
        --coverage=.infection/infection
        --filter="$CHANGED"
        --min-msi=${INFECTION_MR_MIN_MSI:-0}
        --logger-html=infection.html
        --no-progress
        --show-mutations
  timeout: 15 minutes
  allow_failure: true
  artifacts:
    when: always
    paths:
      - infection.html
      - infection.log
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
